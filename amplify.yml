version: 1
frontend:
  phases:
    preBuild:
      commands:
      - echo "No build needed for static frontend"
    build:
      commands:
      - echo "Copying frontend files..."
  artifacts:
    baseDirectory: frontend
    files:
    - '**/*'
  cache:
    paths: []

backend:
  phases:
    preBuild:
      commands:
      - cd backend
      - pip install -r requirements.txt
    build:
      commands:
      - echo "Backend ready for deployment"
  artifacts:
    baseDirectory: backend
    files:
    - '**/*'
