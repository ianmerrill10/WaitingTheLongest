# ============================================================================
# Waiting The Longest™ - Alembic Configuration
# ============================================================================
# Database migrations using Alembic
#
# Usage:
#   alembic revision --autogenerate -m "description"  # Create migration
#   alembic upgrade head                               # Apply all migrations
#   alembic downgrade -1                               # Rollback one migration
#   alembic history                                    # Show migration history
# ============================================================================

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend sys.path with "." for imports
prepend_sys_path = .

# Timezone to use for timestamps
timezone = UTC

# Max characters for short revision identifier
truncate_slug_length = 40

# Set to true to run in "offline" mode
# Generates SQL scripts rather than executing against the database
revision_environment = false

# Set to "true" to require that a database URL be passed at the command line
# rather than loaded from the config file
# sqlalchemy.url = driver://user:pass@localhost/dbname
# Instead, we load from env.py

[post_write_hooks]
# Format migration files with black after generation
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
