# Waiting The Longest™ - Prometheus Configuration
# =================================================
# Metrics collection and alerting setup

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'waitingthelongest'

# Alerting configuration
alerting:
  alertmanagers:
  - static_configs:
    - targets: []

# Rule files for alerts
rule_files:
- /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
# Prometheus self-monitoring
- job_name: 'prometheus'
  static_configs:
  - targets: ['localhost:9090']

# WTL API metrics
- job_name: 'wtl-api'
  static_configs:
  - targets: ['api:8000']
  metrics_path: /metrics
  scrape_interval: 10s

# WTL Worker metrics
- job_name: 'wtl-worker'
  static_configs:
  - targets: ['worker:8001']
  metrics_path: /metrics
  scrape_interval: 30s

# Redis metrics (if using redis_exporter)
- job_name: 'redis'
  static_configs:
  - targets: ['redis:6379']
  metrics_path: /metrics
  scrape_interval: 15s

# PostgreSQL metrics (if using postgres_exporter)
- job_name: 'postgresql'
  static_configs:
  - targets: ['db:5432']
  metrics_path: /metrics
  scrape_interval: 15s

# Node exporter for system metrics
- job_name: 'node'
  static_configs:
  - targets: ['node-exporter:9100']
  scrape_interval: 15s
