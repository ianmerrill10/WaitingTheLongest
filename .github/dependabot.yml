# Dependabot configuration for automatic dependency updates
# https://docs.github.com/en/code-security/dependabot

version: 2
updates:
# Python dependencies
- package-ecosystem: "pip"
  directory: "/backend"
  schedule:
    interval: "weekly"
    day: "monday"
    time: "09:00"
  open-pull-requests-limit: 5
  commit-message:
    prefix: "chore(deps)"
  labels:
  - "dependencies"
  - "python"
  reviewers:
  - "ianmerrill10"

# GitHub Actions
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
    day: "monday"
  commit-message:
    prefix: "chore(ci)"
  labels:
  - "dependencies"
  - "ci"

# Docker
- package-ecosystem: "docker"
  directory: "/backend"
  schedule:
    interval: "monthly"
  commit-message:
    prefix: "chore(docker)"
  labels:
  - "dependencies"
  - "docker"
