name: 🚀 CI/CD Pipeline - Waiting The Longest

on:
  push:
    branches: [main, claude/**, unify-default-into-main]
  pull_request:
    branches: [main, claude/**]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================
  # SECURITY SCAN (Runs First - Highest Priority)
  # ============================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          extra_args: --only-verified
      
      - name: Run Bandit security linter
        run: |
          pip install bandit
          bandit -r backend/app/ -ll -ii

  # ============================================
  # LINT & TYPE CHECK
  # ============================================
  lint:
    name: 🧹 Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install linting tools
        run: |
          pip install black flake8 isort
      
      - name: Check formatting with Black
        run: black --check backend/app backend/tests
      
      - name: Check imports with isort
        run: isort --check-only backend/app backend/tests
      
      - name: Lint with flake8
        run: flake8 backend/app backend/tests --max-line-length=100 --ignore=E501,W503

  # ============================================
  # UNIT TESTS
  # ============================================
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      
      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key-for-ci
        run: |
          cd backend
          pytest -q

  # ============================================
  # BUILD & VALIDATE
  # ============================================
  build:
    name: 🏗️ Build Validation
    runs-on: ubuntu-latest
    needs: [security, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Verify FastAPI app starts
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret
        run: |
          cd backend
          timeout 10 python -c "from app.main import app; print('✅ App loads successfully')" || true

  # ============================================
  # DEPLOY TO PRODUCTION
  # ============================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to IONOS VPS
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/waitingthelongest
            git pull origin main
            source backend/venv/bin/activate
            pip install -r backend/requirements.txt
            sudo systemctl restart waitingthelongest
            sleep 5
            curl -f http://localhost:8000/health || exit 1
            echo "✅ Deployment successful!"

  # ============================================
  # POST-DEPLOY HEALTH CHECK
  # ============================================
  health-check:
    name: 💚 Health Check
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check production health
        run: |
          sleep 30
          curl -f https://waitingthelongest.com/health || exit 1
          echo "✅ Production is healthy!"
