name: 🚀 CI/CD Pipeline - Waiting The Longest

on:
  push:
    branches: [main, claude/*]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================
  # SECURITY SCAN (Runs First - Highest Priority)
  # ============================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          extra_args: --only-verified
      
      - name: Run Bandit security linter
        run: |
          pip install bandit
          bandit -r backend/ -ll -ii

  # ============================================
  # LINT & TYPE CHECK
  # ============================================
  lint:
    name: 🧹 Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install linting tools
        run: |
          pip install black flake8 isort
      
      - name: Check formatting with Black
        run: black --check backend/
      
      - name: Check imports with isort
        run: isort --check-only backend/
      
      - name: Lint with flake8
        run: flake8 backend/ --max-line-length=100 --ignore=E501,W503

  # ============================================
  # DATA QUALITY VALIDATION
  # ============================================
  data-quality:
    name: 🧼 Data Quality
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate rescue directory structure
        run: |
          python backend/tools/rescue_directory_validator.py --fail-on-warn --dump-json

  # ============================================
  # UNIT TESTS
  # ============================================
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, data-quality]
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx
      
      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
        run: |
          cd backend
          pytest --cov=app --cov-report=xml --cov-report=term-missing -v
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml

  # ============================================
  # BUILD & VALIDATE
  # ============================================
  build:
    name: 🏗️ Build Validation
    runs-on: ubuntu-latest
    needs: [security, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Verify FastAPI app starts
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret
        run: |
          cd backend
          timeout 10 python -c "from app.main import app; print('✅ App loads successfully')" || true

  # ============================================
  # DEPLOY TO PRODUCTION
  # ============================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to IONOS VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/waitingthelongest
            git pull origin main
            source backend/venv/bin/activate
            pip install -r backend/requirements.txt
            sudo systemctl restart waitingthelongest
            sleep 5
            curl -f http://localhost:8000/health || exit 1
            echo "✅ Deployment successful!"

  # ============================================
  # POST-DEPLOY HEALTH CHECK
  # ============================================
  health-check:
    name: 💚 Health Check
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check production health
        run: |
          sleep 30
          curl -f https://waitingthelongest.com/health || exit 1
          echo "✅ Production is healthy!"
