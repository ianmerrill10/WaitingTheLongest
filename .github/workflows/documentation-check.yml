name: Documentation Check

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**/*.py'
      - 'scripts/**'
      - 'frontend/**'
      - 'nginx/**'
      - 'systemd/**'

jobs:
  check-documentation:
    name: Verify Documentation Updates
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Check if OWNERS_MANUAL.md was updated
        id: check_docs
        run: |
          # Get list of changed files in this PR
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          
          # Check if any Python files were changed
          PYTHON_CHANGED=$(echo "$CHANGED_FILES" | grep -E '\.py$' | grep -v '__pycache__' | grep -v 'test_' || true)
          
          # Check if OWNERS_MANUAL.md was updated
          DOCS_UPDATED=$(echo "$CHANGED_FILES" | grep -E '^OWNERS_MANUAL\.md$' || true)
          
          echo "Python files changed:"
          echo "$PYTHON_CHANGED"
          echo ""
          echo "OWNERS_MANUAL.md updated: $DOCS_UPDATED"
          
          # If Python files changed but documentation wasn't updated, fail
          if [ -n "$PYTHON_CHANGED" ] && [ -z "$DOCS_UPDATED" ]; then
            echo "::error::Python files were modified but OWNERS_MANUAL.md was not updated!"
            echo "::error::Please update OWNERS_MANUAL.md to reflect your changes."
            echo ""
            echo "Files that require documentation:"
            echo "$PYTHON_CHANGED"
            echo ""
            echo "Documentation requirements:"
            echo "1. Update the relevant section in OWNERS_MANUAL.md"
            echo "2. Add an entry to the Changelog section"
            echo "3. Ensure all new functions have docstrings"
            exit 1
          fi
          
          echo "✅ Documentation check passed!"
      
      - name: Run documentation validator
        if: always()
        run: |
          # Check if the documentation validator script exists
          if [ -f "backend/tools/documentation_validator.py" ]; then
            python backend/tools/documentation_validator.py --root .
          else
            echo "Documentation validator not found, skipping detailed validation"
          fi
      
      - name: Check for docstrings in new functions
        if: always()
        run: |
          # Get list of changed Python files
          CHANGED_PY=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.py$' | grep -v '__pycache__' | grep -v 'test_' || true)
          
          if [ -z "$CHANGED_PY" ]; then
            echo "No Python files changed, skipping docstring check"
            exit 0
          fi
          
          # Simple check for functions without docstrings
          MISSING_DOCSTRINGS=0
          
          for file in $CHANGED_PY; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              
              # Look for function definitions without docstrings
              # This is a basic check - the validator script does more thorough checking
              if grep -n "^def " "$file" | head -5; then
                echo "  Found function definitions in $file"
              fi
            fi
          done
          
          echo "✅ Basic docstring check complete"
      
      - name: Check header documentation
        if: always()
        run: |
          # Get list of new Python files in this PR
          NEW_PY=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD | grep -E '\.py$' | grep -v '__pycache__' | grep -v 'test_' || true)
          
          if [ -z "$NEW_PY" ]; then
            echo "No new Python files, skipping header check"
            exit 0
          fi
          
          echo "Checking new Python files for header documentation..."
          MISSING_HEADER=0
          
          for file in $NEW_PY; do
            if [ -f "$file" ]; then
              # Check if file starts with a docstring
              if ! head -5 "$file" | grep -q '"""'; then
                echo "::warning file=$file::Missing header documentation in new file: $file"
                MISSING_HEADER=1
              fi
            fi
          done
          
          if [ $MISSING_HEADER -eq 1 ]; then
            echo "::warning::Some new files are missing header documentation"
            echo "Please add header comments following the template in DOCUMENTATION_REQUIREMENTS.md"
          else
            echo "✅ All new files have header documentation"
          fi

  documentation-summary:
    name: Documentation Summary
    runs-on: ubuntu-latest
    needs: check-documentation
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "## Documentation Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This workflow ensures all code changes are properly documented." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Requirements:" >> $GITHUB_STEP_SUMMARY
          echo "- OWNERS_MANUAL.md must be updated when Python files change" >> $GITHUB_STEP_SUMMARY
          echo "- All new Python files need header documentation" >> $GITHUB_STEP_SUMMARY
          echo "- All new functions need docstrings" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See docs/DOCUMENTATION_REQUIREMENTS.md for full guidelines." >> $GITHUB_STEP_SUMMARY
