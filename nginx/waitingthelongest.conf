# ==============================================================================
# Waiting The Longest™ - Nginx Configuration
# ==============================================================================
# Primary Domain: waitingthelongest.com
# Redirect Domain: waitedthelongest.com (301 → primary)
# Backend: FastAPI on 127.0.0.1:8000
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# ==============================================================================
# HTTP → HTTPS Redirect (Primary Domain)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name waitingthelongest.com www.waitingthelongest.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://waitingthelongest.com$request_uri;
    }
}

# ==============================================================================
# Redirect Domain (301 to Primary)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name waitedthelongest.com www.waitedthelongest.com;
    return 301 https://waitingthelongest.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name waitedthelongest.com www.waitedthelongest.com;

    # SSL certificates (will be added by Certbot)
    ssl_certificate /etc/letsencrypt/live/waitedthelongest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waitedthelongest.com/privkey.pem;

    return 301 https://waitingthelongest.com$request_uri;
}

# ==============================================================================
# Primary HTTPS Configuration
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name waitingthelongest.com www.waitingthelongest.com;

    # SSL certificates (will be added by Certbot)
    ssl_certificate /etc/letsencrypt/live/waitingthelongest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/waitingthelongest.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Root directory for frontend
    root /opt/waitingthelongest/frontend;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://pagead2.googlesyndication.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.rescuegroups.org; frame-src https://www.youtube.com https://www.google.com;" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # ==============================================================================
    # API Endpoints (Proxy to FastAPI)
    # ==============================================================================
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ==============================================================================
    # Health Check (for monitoring)
    # ==============================================================================
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ==============================================================================
    # Frontend (Static Files)
    # ==============================================================================
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ==============================================================================
    # Security - Block Sensitive Files
    # ==============================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /(\.env|\.git|\.htaccess|\.htpasswd|composer\.json|package\.json) {
        deny all;
    }

    # Block common attack patterns
    location ~ \.(php|asp|aspx|jsp)$ {
        deny all;
        return 404;
    }

    # ==============================================================================
    # Error Pages
    # ==============================================================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
